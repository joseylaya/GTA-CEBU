name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: splitshare_test
          POSTGRES_USER: splitshare
          POSTGRES_PASSWORD: splitshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitshare -d splitshare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://splitshare:splitshare@localhost:5432/splitshare_test
      JWT_SECRET: test-secret-that-is-long-enough-for-authentication
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev --frozen
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run pytest
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
