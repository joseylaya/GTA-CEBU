services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: splitshare
      POSTGRES_USER: splitshare
      POSTGRES_PASSWORD: splitshare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitshare -d splitshare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
